name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - run: bundle exec rake test
